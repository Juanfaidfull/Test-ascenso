<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#05060a">
<title>ASCENSO 4.1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500;700&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css?v=4.40.0">
<!-- SDK oficial de Supabase (opcional). Si no carga, el juego funciona en modo local. -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
</head>
<body>
<div id="stage"><canvas id="game" width="480" height="270"></canvas></div>
<div id="hud" class="hidden"><button id="btnPause" class="ibtn" aria-label="Pausa"></button></div>
<div id="event" class="evt"></div>
<div id="touch" class="hidden">
  <div id="stick"><div class="knob"></div></div>
  <div class="tpad l"><button class="tb" data-a="left" aria-label="Izquierda"></button><button class="tb" data-a="right" aria-label="Derecha"></button></div>
  <div class="tpad r"><button class="tb big jump" data-a="jump" aria-label="Saltar"></button><button class="tb big" data-a="attack" aria-label="Atacar"></button><button id="parryBtn" class="tb parry" data-a="parry" aria-label="Parry: en oleadas dura 1,5 segundos y tiene 5,2 segundos de enfriamiento; en VS dura 1,2 segundos y tiene 6 segundos de enfriamiento"></button><div class="tb slingpad" data-a="sling" role="slider" aria-label="Tirachinas: desliza la bolita arriba o abajo para apuntar y a la derecha para más potencia"><i class="sp-puck"></i></div></div>
</div>
<div id="ui" class="show"></div>
<script src="js/config.js?v=4.40.0"></script>
